<div class="form-group">
  <label for="name">
    Hostel Name
  </label>

  <input
    id="name"
    type="text"
    name="name"
    [(ngModel)]="hostel.name"
    #nameField="ngModel"
    placeholder="Enter hostel name"
    required
  />

  <div
    class="field-error"
    *ngIf="nameField.invalid && nameField.touched"
  >
    <small *ngIf="nameField.errors?.['required']">
      Hostel name is required.
    </small>
  </div>
</div>
