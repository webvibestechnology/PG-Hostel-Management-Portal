<div class="room-container">

  <div class="page-header">

    <h2>Rooms</h2>

    <a
      routerLink="/dashboard/rooms/add"
      class="add-button">
      + Add Room
    </a>

  </div>

 
  <div class="table-container">

    <table>

      <thead>

        <tr>
          <th>Room Number</th>
          <th>Type</th>
          <th>Floor</th>
          <th>Capacity</th>
          <th>Status</th>
          <th>Hostel Name</th>
          <th>Actions</th>
        </tr>

      </thead>

      <tbody>

        <tr *ngFor="let room of rooms">

          <td>
            {{ room.roomNumber }}
          </td>

          <td>
            {{ room.roomType }}
          </td>

          <td>
            {{ room.floor }}
          </td>

          <td>{{ room.capacity }}</td>

          <td>

            <span
              class="status-badge"
              [ngClass]="getStatusClass(room.status)">
              {{ room.status }}
            </span>

          </td>

        
               <td>
                 {{ room.hostel?.name }}
                </td>
            

          <td class="actions">

            <button
              type="button"
              class="edit-button"
              (click)="editRoom(room.id!)">
              Edit
            </button>

            <button
              type="button"
              class="delete-button"
              [disabled]="deletingRoomId === room.id"
              (click)="deleteRoom(room.id!)">
              Delete
            </button>

          </td>

        </tr>

        <tr *ngIf="rooms.length === 0">

          <td
            colspan="7"
            class="no-data">
            No rooms found.
          </td>

        </tr>

      </tbody>

    </table>

  </div>
  <div
  *ngIf="successMessage"
  class="success-message">
  {{ successMessage }}
</div>

</div>
