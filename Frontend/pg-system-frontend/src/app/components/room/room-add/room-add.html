<div class="room-form-container">

  <div class="form-card">

    <h2>Add Room</h2>

    <!-- Backend / General Error -->
    <div
      *ngIf="errorMessage"
      class="error-message"
    >
      {{ errorMessage }}
    </div>

    <form
      #roomForm="ngForm"
      (ngSubmit)="addRoom()"
      novalidate
    >

      <!-- =========================
           HOSTEL
      ========================== -->
      <div class="form-group">

        <label for="hostelId">
          Select Hostel
        </label>

        <select
          id="hostelId"
          name="hostelId"
          [(ngModel)]="room.hostelId"
          #hostelField="ngModel"
          required
        >

          <option [ngValue]="0">
            Select Hostel
          </option>

          <option
            *ngFor="let hostel of hostels"
            [ngValue]="hostel.id"
          >
            {{ hostel.name }}
          </option>

        </select>

        <div
          class="field-error"
          *ngIf="
            hostelField.invalid &&
            hostelField.touched
          "
        >
          <small
            *ngIf="hostelField.errors?.['required']"
          >
            Please select a hostel.
          </small>
        </div>

      </div>


      <!-- =========================
           ROOM NUMBER
      ========================== -->
      <div class="form-group">

        <label for="roomNumber">
          Room Number
        </label>

        <input
          id="roomNumber"
          type="text"
          name="roomNumber"
          [(ngModel)]="room.roomNumber"
          #roomNumberField="ngModel"
          placeholder="Enter room number"
          required
        />

        <div
          class="field-error"
          *ngIf="
            roomNumberField.invalid &&
            roomNumberField.touched
          "
        >
          <small
            *ngIf="
              roomNumberField.errors?.['required']
            "
          >
            Room number is required.
          </small>
        </div>

      </div>


      <!-- =========================
           ROOM TYPE
      ========================== -->
      <div class="form-group">

        <label for="roomType">
          Room Type
        </label>

        <select
          id="roomType"
          name="roomType"
          [(ngModel)]="room.roomType"
          #roomTypeField="ngModel"
          required
        >

          <option value="">
            Select Room Type
          </option>

          <option value="AC">
            AC
          </option>

          <option value="NON-AC">
            Non-AC
          </option>

        </select>

        <div
          class="field-error"
          *ngIf="
            roomTypeField.invalid &&
            roomTypeField.touched
          "
        >
          <small
            *ngIf="
              roomTypeField.errors?.['required']
            "
          >
            Please select room type.
          </small>
        </div>

      </div>


      <!-- =========================
           FLOOR
      ========================== -->
      <div class="form-group">

        <label for="floor">
          Floor
        </label>

        <input
          id="floor"
          type="number"
          name="floor"
          [(ngModel)]="room.floor"
          #floorField="ngModel"
          min="1"
          [max]="getSelectedHostelFloors()"
          step="1"
          required
        />

        <div
          class="field-error"
          *ngIf="
            floorField.invalid &&
            floorField.touched
          "
        >
          <small
            *ngIf="
              floorField.errors?.['required']
            "
          >
            Floor is required.
          </small>

          <small
            *ngIf="
              floorField.errors?.['min']
            "
          >
            Floor must be at least 1.
          </small>

          <small
            *ngIf="
              floorField.errors?.['max']
            "
          >
            Floor cannot exceed the selected hostel's total floors.
          </small>
        </div>

      </div>


      <!-- =========================
           CAPACITY
      ========================== -->
      <div class="form-group">

        <label for="capacity">
          Capacity
        </label>

        <input
          id="capacity"
          type="number"
          name="capacity"
          [(ngModel)]="room.capacity"
          #capacityField="ngModel"
          min="1"
          step="1"
          required
        />

        <div
          class="field-error"
          *ngIf="
            capacityField.invalid &&
            capacityField.touched
          "
        >
          <small
            *ngIf="
              capacityField.errors?.['required']
            "
          >
            Capacity is required.
          </small>

          <small
            *ngIf="
              capacityField.errors?.['min']
            "
          >
            Capacity must be at least 1.
          </small>
        </div>

      </div>


      <!-- =========================
           STATUS
      ========================== -->
      <div class="form-group">

        <label for="status">
          Status
        </label>

        <select
          id="status"
          name="status"
          [(ngModel)]="room.status"
          #statusField="ngModel"
          required
        >

          <option value="AVAILABLE">
            AVAILABLE
          </option>

          <option value="OCCUPIED">
            OCCUPIED
          </option>

          <option value="MAINTENANCE">
            MAINTENANCE
          </option>

        </select>

        <div
          class="field-error"
          *ngIf="
            statusField.invalid &&
            statusField.touched
          "
        >
          <small
            *ngIf="
              statusField.errors?.['required']
            "
          >
            Please select room status.
          </small>
        </div>

      </div>


      <!-- =========================
           ACTIONS
      ========================== -->
      <div class="form-actions">

        <button
          type="submit"
          class="save-button"
          [disabled]="roomForm.invalid"
        >
          Save Room
        </button>

        <button
          type="button"
          class="cancel-button"
          (click)="cancel()"
        >
          Cancel
        </button>

      </div>

    </form>

  </div>

</div>
